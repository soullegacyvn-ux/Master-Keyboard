<title>Masterkeyboard preview</title>
<style>
:root { --mk-preview-height: __MASTERKEYBOARD_HEIGHT__px; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { --mk-preview-scale: 0.19; }
@media (min-width: 224px) { body { --mk-preview-scale: 0.21; } }
@media (min-width: 244px) { body { --mk-preview-scale: 0.23; } }
@media (min-width: 264px) { body { --mk-preview-scale: 0.25; } }
@media (min-width: 285px) { body { --mk-preview-scale: 0.27; } }
@media (min-width: 305px) { body { --mk-preview-scale: 0.29; } }
@media (min-width: 326px) { body { --mk-preview-scale: 0.31; } }
@media (min-width: 346px) { body { --mk-preview-scale: 0.33; } }
@media (min-width: 367px) { body { --mk-preview-scale: 0.35; } }
.mk-preview-scale {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1024px;
  height: var(--mk-preview-height);
  transform: translate(-50%, -50%) scale(var(--mk-preview-scale));
}
.mk-preview-keyboard { padding: 3px 2px 1px; font: 16px/1.2 Arial, sans-serif; }
.mk-preview-row { display: flex; width: 100%; }
.mk-preview-hit {
  display: flex;
  flex-direction: column;
  padding: 1px 1px 2px 2px;
  flex: var(--mk-preview-weight) 1 0;
  min-width: 0;
}
.mk-preview-cap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  text-align: center;
}
.mk-preview-cap[data-preview-glyph] > span { margin-left: 19px; }
.mk-preview-cap[data-preview-glyph]::after {
  content: attr(data-preview-glyph);
  position: absolute;
  left: 21px;
  top: calc(50% - 9px);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #f0ebdb;
  background: #302e2a;
}
.mk-preview-cap[data-preview-glyph="X"]::after { left: auto; right: 17px; }
.mk-preview-profile-badge {
  --retro-badge-label: attr(data-profile-glyph);
  display: var(--mk-profile-preview-badge-display, none);
}
.mk-preview-cap .mk-preview-space-badge {
  --retro-badge-label: "Y";
  position: absolute;
}

</style>
<style>__MASTERKEYBOARD_STYLE__</style>
<style>
.mk-preview-keyboard { border-radius: 10px; }
.mk-preview-scale .mk-preview-cap > span {
  font-size: clamp(24px, calc(var(--retro-row-height) * .53), 32px);
  line-height: 1;
  font-weight: 700;
}
.mk-preview-scale .mk-preview-cap > span._3FZukK3yuHnaZ_X3yujMNS {
  font-size: 17px;
  line-height: 16px;
}
.mk-preview-scale
:is([data-key="Tab"], [data-key="CapsLock"], [data-key="Shift"], [data-key="Backspace"],
    [data-key="Enter"], [data-key="SwitchKeys_Steam"], [data-key="SwitchKeys_Layout"],
    [data-key="MasterkeyboardSelectAll"], [data-key="VKClose"]) .mk-preview-cap > span {
  font-size: 19px;
  line-height: 20px;
}
@media (max-width: 310px) {
  .mk-preview-scale .mk-preview-cap > span._3FZukK3yuHnaZ_X3yujMNS {
    display: none;
  }
}
</style>
